{% extends "admin/admin_base.html" %}
{% block title %}{{ 'Edit' if source else 'New' }} Source{% endblock %}
{% block content %}
<h2>{{ 'Edit' if source else 'New' }} News Source</h2>

<form method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Name *</label>
                <input type="text" class="form-control" name="name" required
                       value="{{ source.name if source else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Slug</label>
                <input type="text" class="form-control" name="slug"
                       value="{{ source.slug if source else '' }}"
                       placeholder="Auto-generated from name if empty">
            </div>
            <div class="mb-3">
                <label class="form-label">Website URL *</label>
                <input type="url" class="form-control" name="url" required
                       value="{{ source.url if source else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Feed URL (for RSS/Atom)</label>
                <input type="url" class="form-control" name="feed_url"
                       value="{{ source.feed_url if source else '' }}">
            </div>
        </div>
        <div class="col-md-6">
            <div class="mb-3">
                <label class="form-label">Feed Type</label>
                <select name="feed_type" class="form-select">
                    {% for ft in feed_types %}
                    <option value="{{ ft }}" {% if source and source.feed_type == ft %}selected{% endif %}>{{ ft }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select">
                    {% for sc in source_categories %}
                    <option value="{{ sc }}" {% if source and source.category == sc %}selected{% endif %}>{{ sc }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Crawler Class (optional)</label>
                <input type="text" class="form-control" name="crawler_class"
                       value="{{ source.crawler_class if source else '' }}"
                       placeholder="e.g. sources.cea_leti.CeaLetiCrawler">
            </div>
            <div class="mb-3">
                <label class="form-label">Crawl Frequency (minutes)</label>
                <input type="number" class="form-control" name="crawl_frequency_minutes" min="10"
                       value="{{ source.crawl_frequency_minutes if source else 60 }}">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="is_active" id="is_active"
                       {{ 'checked' if not source or source.is_active }}>
                <label class="form-check-label" for="is_active">Active</label>
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-primary">{{ 'Update' if source else 'Create' }}</button>
    <a href="{{ url_for('admin.sources') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
