{% extends "admin/admin_base.html" %}
{% block title %}{{ code }} - Admin{% endblock %}
{% block content %}
<div class="card card-fs" style="max-width: 640px;">
    <div class="card-body">
        <h3 class="mb-2">{{ heading }}</h3>
        <p class="text-muted mb-1">{{ explanation }}</p>
        {% if detail %}<p class="mb-1"><strong>Details:</strong> {{ detail }}</p>{% endif %}
        <p class="text-muted" style="font-size: 0.85rem;">Nothing was changed by this request (HTTP {{ code }}).</p>
        <a href="{{ back }}" class="btn btn-fs-primary btn-sm error-back"><i class="bi bi-arrow-left"></i> Go back</a>
    </div>
</div>
{% endblock %}
