# Production overrides
# Requires Docker Compose >= 2.24.4 (!override support).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Older clients: upgrade Compose; do not strip !override or fall back to dev config.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports: !override []  # Not exposed externally — nginx proxies to web:8000
    volumes: !override []  # No source mount in production
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    # Recycle only AFTER a task finishes: RSS KiB or completed task count.
    # Not an in-task memory ceiling, acknowledgement policy, or OOM recovery.
    command: >-
      celery -A celery_app worker -l info -Q llm -c 2 -n llm@%h
      --pool=prefork --max-tasks-per-child=50 --max-memory-per-child=393216
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  worker_fast:
    command: >-
      celery -A celery_app worker -l info -Q crawl,email -c 2 -n fast@%h
      --pool=prefork --max-tasks-per-child=50 --max-memory-per-child=393216
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          # 512M caused a confirmed prefork child MEMCG kill; bounded mitigation.
          memory: 1G

  beat:
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          # Observed idle usage ~245MiB; leave headroom, not a capacity guarantee.
          memory: 384M

  nginx:
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - /etc/letsencrypt/live/yourdomain:/etc/nginx/ssl:ro
    ports: !override
      - "80:80"
      - "443:443"
    restart: always

  mysql:
    ports: !override []  # Not exposed externally — only internal Docker network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: !override []  # Not exposed externally — only internal Docker network
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
