# Production overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    volumes: []  # No source mount in production
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes: []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  beat:
    volumes: []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - /etc/letsencrypt/live/yourdomain:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    restart: always

  mysql:
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
