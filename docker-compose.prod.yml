# Production overrides
# Requires Docker Compose >= 2.24.4 (!override support).
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Older clients: upgrade Compose; do not strip !override or fall back to dev config.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports: !override []  # Not exposed externally — nginx proxies to web:8000
    volumes: !override []  # No source mount in production
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  worker_fast:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    volumes: !override []
    restart: always
    environment:
      FLASK_ENV: production
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Uncomment for SSL:
      # - /etc/letsencrypt/live/yourdomain:/etc/nginx/ssl:ro
    ports: !override
      - "80:80"
      - "443:443"
    restart: always

  mysql:
    ports: !override []  # Not exposed externally — only internal Docker network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    ports: !override []  # Not exposed externally — only internal Docker network
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
