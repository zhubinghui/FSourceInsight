# Production nginx config for FSourceInsight
#
# TWO MODES:
#   1. HTTP-only (default)  — works out of the box, no certs needed
#   2. HTTPS + redirect     — uncomment the marked blocks after obtaining certs
#
# To enable HTTPS:
#   1. Obtain certs (e.g. certbot certonly --standalone -d yourdomain.com)
#   2. Mount certs in docker-compose.prod.yml:
#        volumes:
#          - /etc/letsencrypt/live/yourdomain.com:/etc/nginx/ssl:ro
#   3. Comment out the "HTTP-only mode" server block below
#   4. Uncomment the "HTTPS redirect" and "HTTPS server" blocks
#   5. Replace yourdomain.com with your actual domain
#   6. docker compose restart nginx

upstream flask_app {
    server web:8000;
}

# ── HTTP-only mode (default) ──────────────────────────────────────────
server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # Static files
    location /static/ {
        alias /app/app/web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location /health {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        access_log off;
    }

    # Application
    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}

